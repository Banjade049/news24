<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="News24">
    <meta name="theme-color" content="#090d16" id="themeMeta">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <title>News24 Pro — Romanized Nepali News & NotebookLM</title>

    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --surface-hover: #1c2640;
            --border: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --pill-active: #0284c7;
            --pill-bg: #1e293b;
            --breaking-bg: linear-gradient(90deg, #991b1b, #dc2626);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --notebook-btn: #7c3aed;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.15);
            --pill-active: #0284c7;
            --pill-bg: #e2e8f0;
            --breaking-bg: linear-gradient(90deg, #b91c1c, #ef4444);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --notebook-btn: #6d28d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 30px);
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Glassmorphism Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            transition: background 0.2s;
        }

        [data-theme="light"] header {
            background: rgba(248, 250, 252, 0.92);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .saved-badge-btn {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.4);
            color: #c4b5fd;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .saved-badge-btn:active {
            transform: scale(0.92);
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Breaking News Ticker */
        .breaking-bar {
            background: var(--breaking-bg);
            color: #ffffff;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .breaking-tag {
            background: #ffffff;
            color: #dc2626;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .breaking-marquee {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Offline Bar */
        .offline-bar {
            background: #d97706;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            padding: 5px;
            display: none;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 9px 14px 9px 36px;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        /* Category Horizontal Scroll */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            background: var(--pill-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .cat-pill .count {
            background: rgba(255, 255, 255, 0.15);
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
        }

        .cat-pill.active {
            background: var(--pill-active);
            color: #ffffff;
            border-color: var(--pill-active);
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.35);
        }

        /* Main Container */
        main {
            padding: 14px 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        .feed-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding: 0 4px;
            font-weight: 600;
        }

        /* News Card */
        .news-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
            transition: transform 0.15s, border-color 0.15s;
        }

        .card-clickable {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }

        .card-clickable:active {
            opacity: 0.9;
        }

        .card-media {
            position: relative;
            width: 100%;
            height: 195px;
            background: #1e293b;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .media-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .src-nepal { background: rgba(220, 38, 38, 0.88); }
        .src-mancity { background: rgba(28, 44, 91, 0.92); color: #6cabdd; border: 1px solid #6cabdd; }
        .src-world { background: rgba(30, 64, 175, 0.88); }
        .src-tech { background: rgba(5, 150, 105, 0.88); }

        .time-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 6px;
            backdrop-filter: blur(6px);
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-roman-title {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .card-orig-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.35;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 8px;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .card-snippet {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Card Bottom Action Bar */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px 12px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.08);
            gap: 8px;
        }

        .read-btn {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: var(--pill-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        .btn-action:active {
            transform: scale(0.92);
        }

        .btn-notebook {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.4);
            color: #c4b5fd;
        }

        .btn-notebook:active {
            background: var(--notebook-btn);
            color: #ffffff;
        }

        /* Modal for Saved Articles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-primary {
            background: #7c3aed;
            color: #ffffff;
        }

        .btn-secondary {
            background: var(--pill-bg);
            color: var(--text-primary);
        }

        .saved-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .saved-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .saved-meta {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0284c7;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Skeleton Shimmer */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 270px;
            border-radius: 16px;
            margin-bottom: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <!-- Offline Notification Banner -->
    <div class="offline-bar" id="offlineBar">📴 Internet chaina — cached samachar dekhaudai</div>

    <!-- Breaking News Red Ticker -->
    <div class="breaking-bar" id="breakingBar">
        <span class="breaking-tag">🔴 Taja Alert</span>
        <div class="breaking-marquee" id="breakingText">Taaza khabar bhetiyo...</div>
    </div>

    <!-- Sticky Glass Header -->
    <header>
        <div class="header-top">
            <div class="brand">
                <span class="logo-badge">24</span>
                <div>
                    <h1>News24</h1>
                </div>
            </div>
            
            <div class="header-controls">
                <button class="saved-badge-btn" onclick="openSavedModal()" title="NotebookLM Saved">
                    📓 <span id="savedCount">0</span>
                </button>
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Theme">🌙</button>
                <button class="icon-btn" id="refreshBtn" onclick="fetchLiveNews()" title="Refresh">↻</button>
            </div>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Khabar khojnuhos (Nepali ya English)..." oninput="handleSearch()">
        </div>

        <div class="category-scroll">
            <button class="cat-pill active" onclick="setCategory('all', this)">🔥 Sabai <span class="count" id="count-all">0</span></button>
            <button class="cat-pill" onclick="setCategory('nepal', this)">🇳🇵 Nepal Trending <span class="count" id="count-nepal">0</span></button>
            <button class="cat-pill" onclick="setCategory('mancity', this)">⚽ Man City Khabar <span class="count" id="count-mancity">0</span></button>
            <button class="cat-pill" onclick="setCategory('world', this)">🌍 Bishwa Halchal <span class="count" id="count-world">0</span></button>
            <button class="cat-pill" onclick="setCategory('tech', this)">💻 IT & Internet <span class="count" id="count-tech">0</span></button>
        </div>
    </header>

    <main>
        <div class="feed-info">
            <span id="storyCount">Bityeko 24 ghanta ko khabar...</span>
            <span id="lastUpdated">Updating...</span>
        </div>

        <div id="newsContainer">
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
        </div>
    </main>

    <!-- Modal for NotebookLM Saved Articles -->
    <div id="savedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📓 NotebookLM Saved Articles</h3>
                <button class="icon-btn" onclick="closeSavedModal()">✕</button>
            </div>
            <div class="modal-body" id="savedListContainer">
                <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Kehi khabar save bhayeko chaina.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-primary" onclick="window.open('https://notebooklm.google.com/', '_blank')">🚀 Open NotebookLM</button>
                <button class="btn-modal btn-secondary" onclick="copyAllSavedMarkdown()">📋 Copy All</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">📋 Link copy bhayo!</div>

    <script>
        // Comprehensive News Feeds from Top Portals (Added Nagarik News!)
        const FEEDS = [
            // Nepal Portals (Native Devanagari auto-romanized + English)
            { id: 'nepal', name: 'OnlineKhabar', class: 'src-nepal', url: 'https://www.onlinekhabar.com/feed', isNepali: true },
            { id: 'nepal', name: 'Ratopati', class: 'src-nepal', url: 'https://www.ratopati.com/feed', isNepali: true },
            { id: 'nepal', name: 'Nagarik News', class: 'src-nepal', url: 'https://nagariknews.nagariknetwork.com/feed', isNepali: true },
            { id: 'nepal', name: 'Setopati', class: 'src-nepal', url: 'https://www.setopati.com/feed', isNepali: true },
            { id: 'nepal', name: 'OnlineKhabar English', class: 'src-nepal', url: 'https://english.onlinekhabar.com/feed', isNepali: false },
            
            // Manchester City & Football
            { id: 'mancity', name: 'BBC Man City', class: 'src-mancity', url: 'https://feeds.bbci.co.uk/sport/football/teams/manchester-city/rss.xml', isNepali: false },
            { id: 'mancity', name: 'Sky Sports Man City', class: 'src-mancity', url: 'https://www.skysports.com/rss/12040', isNepali: false },
            
            // World News
            { id: 'world', name: 'BBC World', class: 'src-world', url: 'https://feeds.bbci.co.uk/news/world/rss.xml', isNepali: false },
            { id: 'world', name: 'Al Jazeera', class: 'src-world', url: 'https://www.aljazeera.com/xml/rss/all.xml', isNepali: false },
            
            // IT & Internet
            { id: 'tech', name: 'TechCrunch', class: 'src-tech', url: 'https://techcrunch.com/feed/', isNepali: false },
            { id: 'tech', name: 'The Verge', class: 'src-tech', url: 'https://www.theverge.com/rss/index.xml', isNepali: false }
        ];

        // Guaranteed High-Definition SVG Fallbacks
        const FALLBACKS = {
            nepal: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23881337'/><stop offset='100%' stop-color='%231e1b4b'/></linearGradient></defs><rect width='800' height='450' fill='url(%23g)'/><path d='M100 350 L300 180 L450 300 L600 120 L750 350 Z' fill='%23ffffff' opacity='0.25'/><text x='50%' y='60%' fill='%23ffffff' font-family='sans-serif' font-size='44' font-weight='bold' text-anchor='middle'>🇳🇵 NEPAL TRENDING</text></svg>",
            mancity: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%231c2c5b'/><stop offset='100%' stop-color='%236cabdd'/></linearGradient></defs><rect width='800' height='450' fill='url(%23g)'/><circle cx='400' cy='225' r='90' fill='%23ffffff' opacity='0.15'/><text x='50%' y='58%' fill='%23ffffff' font-family='sans-serif' font-size='46' font-weight='bold' text-anchor='middle'>MANCHESTER CITY ⚽</text></svg>",
            world: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230f172a'/><stop offset='100%' stop-color='%231e40af'/></linearGradient></defs><rect width='800' height='450' fill='url(%23g)'/><circle cx='400' cy='225' r='110' fill='none' stroke='%2338bdf8' stroke-width='4' opacity='0.3'/><text x='50%' y='58%' fill='%23ffffff' font-family='sans-serif' font-size='46' font-weight='bold' text-anchor='middle'>BISHWA HALCHAL 🌍</text></svg>",
            tech: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23064e3b'/><stop offset='100%' stop-color='%230f172a'/></linearGradient></defs><rect width='800' height='450' fill='url(%23g)'/><rect x='320' y='145' width='160' height='160' rx='20' fill='%2310b981' opacity='0.25'/><text x='50%' y='58%' fill='%2334d399' font-family='sans-serif' font-size='46' font-weight='bold' text-anchor='middle'>IT &amp; INTERNET 💻</text></svg>"
        };

        let allArticles = [];
        let currentCategory = 'all';

        // High-Precision Devanagari to Romanized Nepali Transliterator
        function toRomanizedNepali(text) {
            if (!text) return "";
            if (!/[\u0900-\u097F]/.test(text)) {
                return text;
            }

            const wordMap = {
                "काठमाडौं": "Kathmandu", "काठमाडौँ": "Kathmandu", "नेपाल": "Nepal",
                "प्रधानमन्त्री": "Pradhanmantri", "सरकार": "Sarkar", "प्रहरी": "Prahari",
                "अदालत": "Adalat", "सुनकोशी": "Sunkoshi", "जिप": "Jeep",
                "दुर्घटना": "Durghatana", "मृत्यु": "Mrityu", "घाइते": "Ghaite",
                "दसैँ": "Dasain", "दशैं": "Dasain", "तिहार": "Tihar", "यातायात": "Yatayat",
                "सडक": "Sadak", "गाडी": "Gadi", "बलिउड": "Bollywood",
                "अभिनेता": "Abhineta", "गोली": "Goli", "निर्वाचन": "Nirbachan",
                "एमाले": "UML", "कांग्रेस": "Congress", "माओवादी": "Maoist",
                "रवि": "Rabi", "ओली": "Oli", "देउवा": "Deuba", "प्रचण्ड": "Prachanda",
                "क्रिकेट": "Cricket", "फुटबल": "Football", "मन्त्री": "Mantri",
                "पक्राउ": "Pakrau", "प्रतियोगिता": "Pratiyogita"
            };

            let processed = text;
            for (const [k, v] of Object.entries(wordMap)) {
                processed = processed.split(k).join(v);
            }

            const consonants = {
                "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng",
                "च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"nya",
                "ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n",
                "त":"t","थ":"th","द":"d","ध":"dh","न":"n",
                "प":"p","फ":"ph","ब":"b","भ":"bh","म":"m",
                "य":"y","र":"r","ल":"l","व":"w",
                "श":"sh","ष":"sh","स":"s","ह":"h",
                "क्ष":"chhya","त्र":"tra","ज्ञ":"gyan"
            };
            const vowels = {
                "अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ऋ":"ri",
                "ए":"e","ऐ":"ai","ओ":"o","औ":"au"
            };
            const matras = {
                "ा":"a","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri",
                "े":"e","ै":"ai","ो":"o","ौ":"au"
            };

            let res = "";
            for (let i = 0; i < processed.length; i++) {
                let ch = processed[i];
                let next = processed[i+1];
                if (vowels[ch]) {
                    res += vowels[ch];
                } else if (consonants[ch]) {
                    res += consonants[ch];
                    if (next === "्") {
                        i++;
                    } else if (matras[next]) {
                        res += matras[next];
                        i++;
                    } else if (next === "ं" || next === "ँ") {
                        res += "an";
                        i++;
                    } else if (next && (consonants[next] || vowels[next] || next === " " || next === ":" || next === "-" || next === "|")) {
                        res += "a";
                    }
                } else if (ch === "ं" || ch === "ँ") {
                    res += "n";
                } else if (ch === "।") {
                    res += ".";
                } else {
                    res += ch;
                }
            }
            return res.trim().charAt(0).toUpperCase() + res.trim().slice(1);
        }

        // 3-Layer Image Extraction Pipeline
        function extractImage(item, category) {
            if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
            if (item.enclosure && item.enclosure.link && item.enclosure.link.startsWith('http')) return item.enclosure.link;
            
            const combinedHtml = (item.description || '') + ' ' + (item.content || '');
            const match = combinedHtml.match(/<img[^>]+src=["'](https?:\/\/[^"']+)["']/i);
            if (match && match[1]) return match[1];

            return FALLBACKS[category] || FALLBACKS.world;
        }

        // CRITICAL BUG FIX: Parse RSS2JSON UTC date properly (Appends ' UTC' if timezone is missing)
        function parseFeedDate(pubDateStr) {
            if (!pubDateStr) return Date.now();
            let s = pubDateStr.trim();
            // If string is e.g. "2026-10-18 16:44:55", force UTC parsing
            if (!s.includes('Z') && !s.includes('+') && !s.includes('GMT') && !s.includes('UTC')) {
                return new Date(s.replace(/-/g, '/') + ' UTC').getTime();
            }
            return new Date(s).getTime();
        }

        // Relative time in Romanized Nepali (Now accurate to the minute!)
        function getNepaliTime(timestamp) {
            const diffMs = Date.now() - timestamp;
            const mins = Math.max(1, Math.floor(diffMs / 60000));
            if (mins < 60) return `${mins} min agadi`;
            const hours = Math.floor(mins / 60);
            if (hours === 1) return `1 ghanta agadi`;
            if (hours < 24) return `${hours} ghanta agadi`;
            return `1 din agadi`;
        }

        function cleanHtml(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return (temp.textContent || temp.innerText || '').trim();
        }

        async function fetchLiveNews() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.style.transform = 'rotate(360deg)';
            
            let fetchedItems = [];
            const now = Date.now();
            const cutoff = now - (48 * 60 * 60 * 1000); // 48-Hour window

            try {
                const requests = FEEDS.map(feed => 
                    fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.status === 'ok' && data.items) {
                                return data.items.map(item => {
                                    const origTitle = cleanHtml(item.title);
                                    const romanTitle = toRomanizedNepali(origTitle);
                                    return {
                                        origTitle: origTitle,
                                        romanTitle: romanTitle,
                                        isNepaliOrigin: feed.isNepali,
                                        link: item.link,
                                        pubDate: parseFeedDate(item.pubDate),
                                        snippet: toRomanizedNepali(cleanHtml(item.description || '')),
                                        source: feed.name,
                                        sourceClass: feed.class,
                                        category: feed.id,
                                        image: extractImage(item, feed.id)
                                    };
                                });
                            }
                            return [];
                        })
                        .catch(() => [])
                );

                const results = await Promise.all(requests);
                results.forEach(items => fetchedItems.push(...items));

                // Sort by newest first
                allArticles = fetchedItems
                    .filter(item => item.pubDate >= cutoff && item.pubDate <= now + 7200000)
                    .sort((a, b) => b.pubDate - a.pubDate);

                updatePillCounts();
                checkBreakingNews();
                updateSavedCount();

                // Save to localStorage
                if (allArticles.length > 0) {
                    localStorage.setItem('cached_news_pro', JSON.stringify({
                        items: allArticles,
                        time: now
                    }));
                }
            } catch (err) {
                console.error("Fetch error:", err);
            } finally {
                refreshBtn.style.transform = 'none';
                renderNews();
                document.getElementById('lastUpdated').innerText = "Antim update: " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function updatePillCounts() {
            document.getElementById('count-all').innerText = allArticles.length;
            ['nepal', 'mancity', 'world', 'tech'].forEach(cat => {
                const count = allArticles.filter(item => item.category === cat).length;
                const el = document.getElementById(`count-${cat}`);
                if (el) el.innerText = count;
            });
        }

        function checkBreakingNews() {
            const breakingWords = ['breaking', 'urgent', 'alert', 'dies', 'attack', 'champion', 'signs', 'crash', 'khasyo', 'mrityu', 'durghatana'];
            const breakingItem = allArticles.find(item => 
                breakingWords.some(w => (item.romanTitle + ' ' + item.origTitle).toLowerCase().includes(w))
            );
            const bar = document.getElementById('breakingBar');
            const text = document.getElementById('breakingText');
            if (breakingItem) {
                text.innerText = `🚨 ${breakingItem.romanTitle} (${breakingItem.source})`;
                bar.style.display = 'flex';
                bar.onclick = () => window.open(breakingItem.link, '_blank');
            } else {
                bar.style.display = 'none';
            }
        }

        function renderNews(filterText = '') {
            const container = document.getElementById('newsContainer');
            let filtered = allArticles;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }

            if (filterText.trim()) {
                const q = filterText.toLowerCase();
                filtered = filtered.filter(item => 
                    item.romanTitle.toLowerCase().includes(q) || 
                    item.origTitle.toLowerCase().includes(q) || 
                    item.snippet.toLowerCase().includes(q) || 
                    item.source.toLowerCase().includes(q)
                );
            }

            document.getElementById('storyCount').innerText = `${filtered.length} wota khabar bityeko 24 ghanta ma`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px 10px; color: var(--text-secondary);">
                        <p style="font-size: 36px; margin-bottom: 10px;">🗞️</p>
                        <p style="font-weight: 600;">Yo category ma ahile khabar bhetiyena.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((item) => {
                const subTitleHtml = item.isNepaliOrigin ? 
                    `<div class="card-orig-title">🇳🇵 <b>Asli:</b> ${item.origTitle}</div>` : '';

                const safeTitle = item.romanTitle.replace(/'/g, "\\'");
                const safeUrl = item.link;
                const safeSource = item.source.replace(/'/g, "\\'");
                const safeSnippet = (item.snippet || '').substring(0, 150).replace(/'/g, "\\'");

                return `
                <div class="news-card">
                    <a href="${item.link}" target="_blank" rel="noopener" class="card-clickable">
                        <div class="card-media">
                            <img class="card-img" src="${item.image}" alt="News Image" onerror="this.src='${FALLBACKS[item.category] || FALLBACKS.world}'" loading="lazy">
                            <span class="media-badge ${item.sourceClass}">${item.source}</span>
                            <span class="time-tag">⏱️ ${getNepaliTime(item.pubDate)}</span>
                        </div>
                        <div class="card-body">
                            <div class="card-roman-title">${item.romanTitle}</div>
                            ${subTitleHtml}
                            ${item.snippet ? `<div class="card-snippet">${item.snippet}</div>` : ''}
                        </div>
                    </a>
                    <div class="card-actions">
                        <a href="${item.link}" target="_blank" rel="noopener" class="read-btn">Padhnus →</a>
                        <div class="action-buttons">
                            <button type="button" class="btn-action btn-notebook" onclick="saveToNotebookLM(event, '${safeTitle}', '${safeUrl}', '${safeSource}', '${safeSnippet}')" title="Save to NotebookLM">
                                📓 NotebookLM
                            </button>
                            <button type="button" class="btn-action btn-share" onclick="handleShare(event, '${safeTitle}', '${safeUrl}')" title="Share Article">
                                📤 Share
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // NotebookLM Integration: Calls Port 5051 API with LocalStorage Fallback
        async function saveToNotebookLM(event, title, url, source, snippet) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            showToast("⏳ NotebookLM ma add gardai...");
            const apiHost = window.location.hostname || '192.168.1.127';
            
            try {
                const res = await fetch(`http://${apiHost}:5051/save-article`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, url, source, snippet })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(`📓 NotebookLM ma save bhayo! (${data.total_saved} saved)`);
                    updateSavedCount();
                } else {
                    saveToLocalStorage(title, url, source, snippet);
                }
            } catch (err) {
                // If backend API isn't reached (e.g. on mobile outside Wi-Fi), save locally
                saveToLocalStorage(title, url, source, snippet);
            }
        }

        function saveToLocalStorage(title, url, source, snippet) {
            let saved = JSON.parse(localStorage.getItem('news24_saved_articles') || '[]');
            if (!saved.some(a => a.url === url)) {
                saved.unshift({ title, url, source, snippet, saved_at: new Date().toLocaleTimeString() });
                localStorage.setItem('news24_saved_articles', JSON.stringify(saved));
                showToast(`📓 Saved to Notebook queue! (${saved.length} saved)`);
                updateSavedCount();
            } else {
                showToast(`📓 Paila nai save bhayeko cha!`);
            }
        }

        function updateSavedCount() {
            // Count from local storage or fetch from API
            const saved = JSON.parse(localStorage.getItem('news24_saved_articles') || '[]');
            const badge = document.getElementById('savedCount');
            if (badge) badge.innerText = saved.length;
        }

        // Modal for viewing saved articles
        function openSavedModal() {
            const modal = document.getElementById('savedModal');
            const container = document.getElementById('savedListContainer');
            const saved = JSON.parse(localStorage.getItem('news24_saved_articles') || '[]');
            
            if (saved.length === 0) {
                container.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 30px;">Kehi khabar save bhayeko chaina.<br><small>News card ko 📓 NotebookLM button thichnus!</small></p>`;
            } else {
                container.innerHTML = saved.map((a, i) => `
                    <div class="saved-item">
                        <div class="saved-title">${i+1}. ${a.title}</div>
                        <div class="saved-meta">Source: ${a.source} | <a href="${a.url}" target="_blank" style="color:var(--accent);">Link ↗</a></div>
                    </div>
                `).join('');
            }
            modal.style.display = 'flex';
        }

        function closeSavedModal() {
            document.getElementById('savedModal').style.display = 'none';
        }

        function copyAllSavedMarkdown() {
            const saved = JSON.parse(localStorage.getItem('news24_saved_articles') || '[]');
            if (saved.length === 0) {
                showToast("Save bhayeko khabar chaina!");
                return;
            }
            let md = "# News24 Saved Articles for NotebookLM\n\n";
            saved.forEach((a, i) => {
                md += `### ${i+1}. ${a.title}\n- Link: ${a.url}\n- Source: ${a.source}\n\n`;
            });
            navigator.clipboard.writeText(md).then(() => {
                showToast("📋 Sabai khabar Markdown ma copy bhayo!");
            });
        }

        // Functional Share Handler with Native Sheet + Clipboard Toast Fallback
        async function handleShare(event, title, url) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: title,
                        text: title + " - News24",
                        url: url
                    });
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        copyToClipboard(url);
                    }
                    return;
                }
            }
            copyToClipboard(url);
        }

        function copyToClipboard(url) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url)
                    .then(() => showToast("📋 Link copy bhayo!"))
                    .catch(() => showToast(url));
            } else {
                showToast("Link: " + url);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderNews(document.getElementById('searchInput').value);
        }

        function handleSearch() {
            renderNews(document.getElementById('searchInput').value);
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            document.getElementById('themeToggle').innerText = next === 'dark' ? '🌙' : '☀️';
            document.getElementById('themeMeta').setAttribute('content', next === 'dark' ? '#090d16' : '#f8fafc');
            localStorage.setItem('theme_pref', next);
        }

        // Initialize Theme
        const savedTheme = localStorage.getItem('theme_pref') || 
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '🌙' : '☀️';

        // Online/Offline detection
        window.addEventListener('online', () => document.getElementById('offlineBar').style.display = 'none');
        window.addEventListener('offline', () => document.getElementById('offlineBar').style.display = 'block');
        if (!navigator.onLine) document.getElementById('offlineBar').style.display = 'block';

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg fail:', err));
        }

        // Auto-refresh every 5 minutes
        setInterval(fetchLiveNews, 300000);

        // Load Cached first, then fetch live
        const cached = localStorage.getItem('cached_news_pro');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                allArticles = parsed.items || [];
                updatePillCounts();
                renderNews();
            } catch (e) {}
        }
        updateSavedCount();
        fetchLiveNews();
    </script>
</body>
</html>
