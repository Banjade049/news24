<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="News24">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <title>News24 — Last 24 Hours</title>

    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --card-border: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --pill-active: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(env(safe-area-inset-bottom) + 30px);
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 18px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .refresh-btn {
            background: #1e293b;
            border: none;
            color: #f8fafc;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .refresh-btn:active {
            transform: rotate(180deg) scale(0.9);
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            background: #131b2e;
            border: 1px solid #1e293b;
            padding: 9px 14px 9px 36px;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        /* Category Scroll */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            background: #1e293b;
            color: var(--text-secondary);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-pill.active {
            background: var(--pill-active);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
        }

        /* News Stream */
        main {
            padding: 16px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .feed-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s, border-color 0.15s;
            cursor: pointer;
        }

        .news-card:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.4px;
        }

        .src-bbc { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .src-aljazeera { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .src-techcrunch { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .src-hackernews { background: rgba(249, 115, 22, 0.15); color: #fb923c; }

        .time-badge {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .card-snippet {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            padding-top: 4px;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #131b2e 25%, #1e293b 50%, #131b2e 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            height: 120px;
        }

        /* iOS Install Guide Toast */
        .ios-tip {
            background: #1e293b;
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ios-tip-icon {
            font-size: 20px;
        }

        .ios-tip b {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="brand">
                <span class="logo-badge">24</span>
                <h1>News24</h1>
            </div>
            <div class="live-indicator">
                <span class="pulse-dot"></span>
                <span>Past 24h</span>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="fetchLiveNews()" title="Refresh">↻</button>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search 24h headlines..." oninput="handleSearch()">
        </div>

        <div class="category-scroll">
            <button class="cat-pill active" onclick="setCategory('all', this)">🔥 All News</button>
            <button class="cat-pill" onclick="setCategory('world', this)">🌍 World</button>
            <button class="cat-pill" onclick="setCategory('tech', this)">⚡ Tech & Cyber</button>
            <button class="cat-pill" onclick="setCategory('aljazeera', this)">📰 Global Beat</button>
        </div>
    </header>

    <main>
        <div class="ios-tip">
            <span class="ios-tip-icon">📲</span>
            <div><b>iPhone Tip:</b> Tap Safari's <b>Share</b> button and tap <b>"Add to Home Screen"</b> to install this as a full app!</div>
        </div>

        <div class="feed-info">
            <span id="storyCount">Filtering last 24h...</span>
            <span id="lastUpdated">Updated just now</span>
        </div>

        <div id="newsContainer">
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
            <div class="skeleton-card skeleton"></div>
        </div>
    </main>

    <script>
        const FEEDS = [
            { id: 'world', name: 'BBC News', class: 'src-bbc', url: 'https://feeds.bbci.co.uk/news/world/rss.xml' },
            { id: 'aljazeera', name: 'Al Jazeera', class: 'src-aljazeera', url: 'https://www.aljazeera.com/xml/rss/all.xml' },
            { id: 'tech', name: 'TechCrunch', class: 'src-techcrunch', url: 'https://techcrunch.com/feed/' },
            { id: 'tech', name: 'Hacker News', class: 'src-hackernews', url: 'https://news.ycombinator.com/rss' }
        ];

        let allArticles = [];
        let currentCategory = 'all';

        async function fetchLiveNews() {
            const container = document.getElementById('newsContainer');
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.style.transform = 'rotate(360deg)';
            
            let fetchedItems = [];
            const now = Date.now();
            const twentyFourHoursAgo = now - (24 * 60 * 60 * 1000);

            try {
                const requests = FEEDS.map(feed => 
                    fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`)
                        .then(r => r.json())
                        .then(data => {
                            if (data.status === 'ok' && data.items) {
                                return data.items.map(item => ({
                                    title: item.title,
                                    link: item.link,
                                    pubDate: new Date(item.pubDate).getTime() || now,
                                    snippet: cleanHtml(item.description || ''),
                                    source: feed.name,
                                    sourceClass: feed.class,
                                    category: feed.id
                                }));
                            }
                            return [];
                        })
                        .catch(() => [])
                );

                const results = await Promise.all(requests);
                results.forEach(items => fetchedItems.push(...items));

                // Filter items from past 24 hours only
                allArticles = fetchedItems
                    .filter(item => item.pubDate >= twentyFourHoursAgo && item.pubDate <= now + 3600000)
                    .sort((a, b) => b.pubDate - a.pubDate);

                // Save to localStorage for instant offline access
                if (allArticles.length > 0) {
                    localStorage.setItem('cached_news_24', JSON.stringify({
                        items: allArticles,
                        time: now
                    }));
                }
            } catch (err) {
                console.error("Fetch error:", err);
            } finally {
                refreshBtn.style.transform = 'none';
                renderNews();
                document.getElementById('lastUpdated').innerText = "Updated " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function cleanHtml(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return temp.textContent || temp.innerText || '';
        }

        function getRelativeTime(timestamp) {
            const diffMs = Date.now() - timestamp;
            const mins = Math.max(1, Math.floor(diffMs / 60000));
            if (mins < 60) return `${mins}m ago`;
            const hours = Math.floor(mins / 60);
            return `${hours}h ago`;
        }

        function renderNews(filterText = '') {
            const container = document.getElementById('newsContainer');
            let filtered = allArticles;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }

            if (filterText.trim()) {
                const q = filterText.toLowerCase();
                filtered = filtered.filter(item => item.title.toLowerCase().includes(q) || item.snippet.toLowerCase().includes(q));
            }

            document.getElementById('storyCount').innerText = `${filtered.length} stories in last 24h`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 10px; color: var(--text-secondary);">
                        <p style="font-size: 32px; margin-bottom: 8px;">🗞️</p>
                        <p>No stories found matching your filter in the last 24h.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <a href="${item.link}" target="_blank" rel="noopener" class="news-card">
                    <div class="card-meta">
                        <span class="source-tag ${item.sourceClass}">${item.source}</span>
                        <span class="time-badge">${getRelativeTime(item.pubDate)}</span>
                    </div>
                    <div class="card-title">${item.title}</div>
                    ${item.snippet ? `<div class="card-snippet">${item.snippet}</div>` : ''}
                    <div class="card-footer">
                        <span>Read full story →</span>
                    </div>
                </a>
            `).join('');
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderNews(document.getElementById('searchInput').value);
        }

        function handleSearch() {
            renderNews(document.getElementById('searchInput').value);
        }

        // Initialize: Load cached news first, then fetch live
        const cached = localStorage.getItem('cached_news_24');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                allArticles = parsed.items || [];
                renderNews();
            } catch (e) {}
        }
        fetchLiveNews();
    </script>
</body>
</html>
